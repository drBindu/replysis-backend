# 1. Basic App Info
spring.application.name=backend
server.port=${PORT:8082}

# 2. Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/copilotx}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# 3. Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. AI API Keys (set these as environment variables on the server — never hardcode here)
groq.api.key=${GROQ_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
speechmatics.api.key=${SPEECHMATICS_API_KEY:}

# 4b. Google OAuth (used server-side only by GoogleAuthController to complete the
# desktop app sign-in token exchange — never shipped inside the app itself)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

# 5. Firebase
firebase.enabled=false

# 6. Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production defaults: never expose internal exception details, and only trust
# forwarded client-IP headers when the reverse proxy is explicitly configured.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
security.trusted-proxy.enabled=${TRUSTED_PROXY_ENABLED:false}

# 7. PDF Service
pdf.service.url=${PDF_SERVICE_URL:http://replysis-pdf-service:3001}
# Shared secret between this backend and the PDF service. Both containers must
# receive the same PDF_SERVICE_TOKEN env var; the PDF service refuses requests
# without it. Generate one with e.g.: openssl rand -hex 32
pdf.service.token=${PDF_SERVICE_TOKEN:}

# Shared only by the frontend admin service and this backend to coordinate
# complete account deletion. Generate a unique random value per environment.
account.deletion.token=${ACCOUNT_DELETION_TOKEN:}
